name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build (vercel + static)
        run: npm run build

      - name: Resolver versao do Playwright
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache do Chromium
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Instalar Chromium + dependencias do SO
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Instalar so dependencias do SO (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: E2E (Playwright)
        run: npm run test:e2e

      - name: Empacotar build estatico
        run: npm run package:static

      - uses: actions/upload-artifact@v4
        with:
          name: nomad-site-static
          path: release/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Relatorios em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-falha
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
